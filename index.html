<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Cheeb-Suika</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Cheeb-Suika</h1>
        <p>le balls boumce</p>
      </div>
      <div class="score-box">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <section class="game-layout" aria-label="Suika game">
      <div class="game-wrap">
        <div class="next-box">
          <span>NEXT</span>
          <img id="next-ball" src="images/ball1.png" alt="Next character">
        </div>

        <div id="game-container" class="game-container">
          <canvas id="game-canvas" aria-label="Game board"></canvas>
          <div id="game-over" class="game-over" hidden>
            <div class="game-over-title">GAME OVER</div>
            <div class="game-over-score">Score: <span id="final-score">0</span></div>
            <button id="restart-button" type="button">PLAY AGAIN</button>
          </div>
        </div>

        <div class="controls">
          <button id="restart-top" type="button">RESTART</button>
          <span>Tap or click to drop</span>
        </div>
      </div>

      <aside class="rules">
        <h2>HOW TO PLAY</h2>
        <p>Move left and right to aim.</p>
        <p>Tap to drop the next character.</p>
        <p>Two matching characters merge into the next level.</p>
        <p>Build upward without crossing the line.</p>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
